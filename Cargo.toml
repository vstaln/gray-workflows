[package]
name = "gray-workflows"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Batch/durable multi-agent workflows for gray: fan a yaml/json spec across `gray subagents run` items with per-item worktrees, a resumable ledger, and an aggregate report"

[lib]
name = "gray_workflows"
path = "src/lib.rs"

[[bin]]
name = "gray-workflows"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
yaml-rust2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[profile.release]
strip = true
